name: scviraltracer
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # ---- Python, used by 04_pseudotime/scanpy_dpt.py ---------------------------
  - python=3.10
  - numpy>=1.23
  - pandas>=1.5
  - scipy>=1.9
  - scanpy>=1.9
  - openpyxl>=3.0          # only needed to read .xlsx matrices

  # ---- Command line tools, used by 01_read_processing_and_qc ----------------
  # Version numbers are the ones this pipeline was developed against. Newer
  # releases are expected to work but will produce slightly different counts,
  # because aligner and quantifier behaviour changes between versions.
  - fastqc=0.12.1
  - trim-galore=0.6.10
  - star=2.7.11b
  - samtools=1.19
  - subread=2.0.6          # provides featureCounts
